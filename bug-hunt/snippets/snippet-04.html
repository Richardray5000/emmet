<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Snippet 04</title>

</head>

<body style="font-family: Georgia, serif; max-width: 560px; margin: 2rem auto;">
  <h1>Snippet 04</h1>
  <p><strong>Should show:</strong> Welcome back</p>
  <hr>
  <p id="out"> welcome</p>

  <!-- This is a  TypeError: Cannot set properties of null which means that the JavaScript wasn't linked with a script tag and with a defer attribute as well so I removed the script tag from the head tag to the body tag cos the browser loads the elements before JavaSript. -->
  <script>
    const out = document.querySelector("#out");
    out.textContent = " Welcome back";
  </script>
</body>

</html>
