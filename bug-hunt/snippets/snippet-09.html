<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snippet 09</title>
</head>
<body style="font-family: Georgia, serif; max-width: 560px; margin: 2rem auto;">
  <h1>Snippet 09</h1>
  <p><strong>Should show:</strong> Sum: 15</p>
  <hr>
  <input id="a" value="5">
  <input id="b" value="10">
  <p id="out"></p>
  <script>
    const a = document.getElementById("a").value;
    const b = document.getElementById("b").value;
    document.getElementById("out").textContent = "Sum: " + (a + b);
  </script>
</body>
</html>
